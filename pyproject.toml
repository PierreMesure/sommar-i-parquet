[project]
name = "sommar-i-parquet"
version = "0.1.0"
description = "Fetch the Sommar & Vinter i P1 archive and write it as Parquet"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bertopic>=0.17.4",
    "hdbscan>=0.8.44",
    "httpx>=0.28.1",
    "mlx-embeddings>=0.1.0",
    "numpy>=2.4.6",
    "openai>=3.0.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "stopwordsiso>=0.7.1",
    "tiktoken>=0.13.0",
    "umap-learn>=0.5.12",
    "whispermlx>=3.12.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
